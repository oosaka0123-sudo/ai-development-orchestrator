name: Customer Guide Council

on:
  push:
    branches:
      - council/customer-guide-12
    paths:
      - scripts/customer-guide-council.mjs
      - .github/workflows/customer-guide-council.yml

permissions:
  contents: read

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_COUNCIL_MODEL: ${{ vars.ANTHROPIC_COUNCIL_MODEL }}
      GEMINI_COUNCIL_MODEL: ${{ vars.GEMINI_COUNCIL_MODEL }}
      OPENAI_COUNCIL_MODEL: ${{ vars.OPENAI_COUNCIL_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run three-agent council
        run: node scripts/customer-guide-council.mjs
      - name: Upload council result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-guide-council-result
          path: customer-guide-council-result.json
          if-no-files-found: ignore
