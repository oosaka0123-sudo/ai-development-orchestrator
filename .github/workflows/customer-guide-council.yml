name: Customer Guide Council

on:
  push:
    branches:
      - council/customer-guide-12
    paths:
      - scripts/customer-guide-claude.mjs
      - .github/workflows/customer-guide-council.yml

permissions:
  contents: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_COUNCIL_MODEL: ${{ vars.ANTHROPIC_COUNCIL_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Claude council review
        run: node scripts/customer-guide-claude.mjs
      - name: Upload Claude result
        uses: actions/upload-artifact@v4
        with:
          name: customer-guide-claude-result
          path: customer-guide-claude-result.json
