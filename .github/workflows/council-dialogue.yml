name: Three-model content dialogue
on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Firestore session UUID
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: council-${{ inputs.session_id }}
  cancel-in-progress: false
jobs:
  dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.COUNCIL_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.COUNCIL_GCP_SERVICE_ACCOUNT }}
      - run: npm ci
      - run: npm run build
      - name: Run four-turn council
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.COUNCIL_GCP_PROJECT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_COUNCIL_MODEL: ${{ vars.OPENAI_COUNCIL_MODEL }}
          ANTHROPIC_COUNCIL_MODEL: ${{ vars.ANTHROPIC_COUNCIL_MODEL }}
          GEMINI_COUNCIL_MODEL: ${{ vars.GEMINI_COUNCIL_MODEL }}
          COUNCIL_MODEL_PRICING_JSON: ${{ vars.COUNCIL_MODEL_PRICING_JSON }}
        run: node dist/dialogueJob.js "${{ inputs.session_id }}"
